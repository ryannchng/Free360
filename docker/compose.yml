services:
  free360:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_PATH: /data/free360.sqlite
      FREE360_SETUP_CODE: ${FREE360_SETUP_CODE:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - free360-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  free360-data:
