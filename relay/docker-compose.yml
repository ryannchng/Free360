services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      RELAY_DATA_PATH: /data/relay-state.json
    volumes:
      - relay-data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - relay
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
